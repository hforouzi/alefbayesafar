# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  destination.ourairports_airports_csv_url: 'https://davidmegginson.github.io/ourairports-data/airports.csv'
  destination.ourairports_cache_path: '%kernel.project_dir%/var/import/destination/ourairports/airports.csv'
  destination.geonames_cache_directory: '%kernel.project_dir%/var/import/destination/geonames'
  firecrawl.base_url: 'https://api.firecrawl.dev'
  flight.external_offer_ttl_minutes: '20'
  tour.external_offer_ttl_minutes: '360'
  openai.base_url: 'https://api.openai.com'
  openai.default_model: 'gpt-4o-mini'


services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # tag destination import providers for the provider registry
  _instanceof:
    App\Modules\Destination\Provider\DestinationProviderInterface:
      tags: [ 'destination.provider' ]
    App\Modules\SearchSource\Provider\TravelDataProviderInterface:
      tags: [ 'travel_data.provider' ]
    App\Modules\Hotel\Provider\HotelSearchProviderInterface:
      tags: [ 'hotel_search.provider' ]
    App\Modules\Hotel\Provider\HotelOfferProviderInterface:
      tags: [ 'hotel_offer.provider' ]
    App\Modules\Flight\Provider\FlightOfferProviderInterface:
      tags: [ 'flight_offer.provider' ]
    App\Modules\Tour\Provider\ExternalTourOfferProviderInterface:
      tags: [ 'external_tour_offer.provider' ]
    App\Modules\Activity\Provider\ActivityOfferProviderInterface:
      tags: [ 'activity_offer.provider' ]

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/*'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/*/Helper/'
      - '../src/Kernel.php'
      - '../src/*/*Entity.php'
      - '../src/Tests/'

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones
  App\Service\ModuleManager:
    arguments:
      $projectDir: '%kernel.project_dir%'
  App\Service\TwigPathService:
    arguments:
      $twig: '@twig'
      $kernelProjectDir: '%kernel.project_dir%'
  App\Service\AppExtension:
      arguments:
        $menuService: '@App\Modules\Default\Service\MenuService'
      tags: [ 'twig.extension' ]

  App\Modules\Destination\Provider\OurAirportsAirportProvider:
    arguments:
      $sourceUrl: '%destination.ourairports_airports_csv_url%'
      $cachePath: '%destination.ourairports_cache_path%'

  App\Modules\Destination\Service\DestinationImportService:
    arguments:
      $debugDataHolder: '@?doctrine.debug_data_holder'

  App\Modules\Destination\Service\PersianDestinationNameEnrichmentService:
    arguments:
      $cacheDirectory: '%destination.geonames_cache_directory%'

  App\Modules\Destination\Provider\GeoNamesDestinationProvider:
    arguments:
      $cacheDirectory: '%destination.geonames_cache_directory%'

  App\Modules\SearchSource\Provider\FirecrawlClient:
    arguments:
      $apiKey: '%env(default::FIRECRAWL_API_KEY)%'
      $baseUrl: '%env(default:firecrawl.base_url:FIRECRAWL_BASE_URL)%'

  App\Modules\Hotel\Service\HotelCandidatePayloadSigner:
    arguments:
      $secret: '%kernel.secret%'

  App\Modules\TripPlanner\Service\OpenAiClient:
    arguments:
      $apiKey: '%env(default::OPENAI_API_KEY)%'
      $model: '%env(default:openai.default_model:OPENAI_MODEL)%'
      $baseUrl: '%env(default:openai.base_url:OPENAI_BASE_URL)%'

  # Both interfaces are bound to their OpenAI-backed implementation, which
  # itself falls back to the deterministic implementation automatically
  # whenever OPENAI_API_KEY is missing or the call fails.
  App\Modules\TripPlanner\Service\TravelIntentInterpreterInterface: '@App\Modules\TripPlanner\Service\OpenAiTravelIntentInterpreter'
  App\Modules\TripPlanner\Service\TravelRecommendationExplanationServiceInterface: '@App\Modules\TripPlanner\Service\OpenAiTravelRecommendationExplanationService'
